name: Node.js CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: './.node-version'
      - run: npm ci
      - run: npm run precommit
      - run: npm run test:scores
      - run: npm run scores:check
